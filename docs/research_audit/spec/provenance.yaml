spec_version: "3.0"

# =============================================================================
# Commits
# =============================================================================

code_reference_commit: "c6cc0968ccf4b39e6400792b6bdd38a4e57135cd"
code_reference_commit_description: >
  Baseline commit of the Factor-Path Diffusion codebase against which
  the architecture audit was performed. All forensic analysis in
  docs/research_audit/ references this commit as the implementation
  ground truth.

audit_v1_commit: "aa14213af5667157000c94776fdd1d086575130e"
audit_v1_commit_description: >
  First-pass architecture audit. Identified structural issues:
  ambiguous intervention naming, missing static path verification,
  branch-to-trunk write not formally forbidden.

audit_v2_commit: "c700d341eb543c83e7d10ced034ffc2d8a179762"
audit_v2_commit_description: >
  Second-pass audit with corrected intervention taxonomy, PathCertificate
  specification, and formal architecture constraints.

spec_freeze_base_commit: "c700d341eb543c83e7d10ced034ffc2d8a179762"
spec_freeze_base_commit_description: >
  The commit on top of which the spec freeze is applied. All spec files
  in docs/research_audit/spec/ are considered authoritative from this
  commit onward, subject to the freeze commit below.

spec_freeze_commit: null
spec_freeze_commit_description: >
  Set to the commit hash once specification freeze is formally approved.
  Null indicates freeze has not yet been applied. After freeze, any
  change to files under docs/research_audit/spec/ requires a spec
  amendment proposal (SAP) and ledger entry.

spec_freeze_commit_reporting_policy: >
  Reported in final agent response; not self-embedded in the same commit.
  The freeze commit hash is communicated externally (in the PR description,
  agent conversation, or project ledger) rather than being baked into
  the frozen spec files themselves. This prevents circular dependencies
  where the frozen spec would need to predict its own commit hash.

cutoff_date: "2026-07-27"
cutoff_date_description: >
  The date after which new research directions, architecture changes,
  or metric additions require a formal proposal. All current spec
  content has been audited and frozen as of this date. Post-cutoff
  changes must be tracked in the project ledger under
  ~/research/private-projects/factor-gated-routing/ledgers/.

# =============================================================================
# Repository Structure (Audited)
# =============================================================================

repository_structure:
  root: "/home/gongjae/projects/research/factor-gated-routing"
  key_directories:
    - path: "src/"
      description: "Core implementation (models, training, inference)"
    - path: "docs/research_audit/"
      description: "Audit artifacts: architecture analysis, intervention audit, metric definitions"
    - path: "docs/research_audit/spec/"
      description: "Canonical specification files (this directory)"
    - path: "docs/research_audit/original_audit_conversation.md"
      description: "Raw audit conversation log from v1 audit"
    - path: "docs/research_audit/FINAL_AUDIT_DOCUMENT.md"
      description: "Final synthesized audit report"
    - path: "docs/research_audit/INTERVENTION_AUDIT.md"
      description: "Detailed intervention mode audit"
    - path: "docs/research_audit/AUDIT_REVIEW_METRIC_DEFINITIONS.md"
      description: "Original metric definitions (superseded by spec/metrics.yaml)"
  spec_files:
    - "ARCHITECTURE_SPEC.md"
    - "INTERVENTION_SPEC.md"
    - "architecture.yaml"
    - "graphs.yaml"
    - "metrics.yaml"
    - "provenance.yaml"
