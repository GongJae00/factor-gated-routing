# =============================================================================
# External Dependencies
# =============================================================================

external_dependencies:
  - name: "research-codex-config"
    path: "~/research/"
    purpose: "Workstation framework, automation scripts, quality contracts"

  - name: "private-project-ledger"
    path: "~/research/private-projects/factor-gated-routing/"
    purpose: "Private project state: ledgers, PaperOrchestra workspace, Zotero links"

  - name: "zotero-library"
    path: "~/Zotero/"
    purpose: "Reference management for literature review"

# =============================================================================
# Audit Methodology
# =============================================================================

audit_methodology:
  code_forensics:
    tool: "manual code review + automated grep patterns"
    scope: "all *.py files under src/, all config *.yaml files"
    checks:
      - "InterventionMode enum completeness (8 modes)"
      - "Gate tensor usage consistency"
      - "Branch-to-trunk write detection (no assignment to trunk from branch files)"
      - "PathCertificate implementation existence"
      - "FactorAdapter input signature correctness"

  literature_validation:
    status: "BLOCKED"
    reason: >
      Literature search for related factor-graph diffusion architectures
      has not been completed. Requires Semantic Scholar + Crossref
      verification pass before literature_validation can move to VERIFIED.

  cross_document_consistency:
    status: "FAILED"
    failed_checks:
      - "ARCHITECTURE_SPEC.md vs architecture.yaml: parameter count discrepancies"
      - "INTERVENTION_SPEC.md vs code: stale names used in test files"
      - "metrics.yaml vs AUDIT_REVIEW_METRIC_DEFINITIONS.md: duplicate definitions"
    resolution: >
      Spec files created as part of v3.0 spec freeze. Cross-document
      consistency must be re-verified after all spec files are written
      and stale references in code are removed.

  specification_freeze:
    status: "FAILED"
    reason: "spec_freeze_commit is null; formal freeze not yet executed"
    next_step: >
      Run research-check --spec-freeze . to validate all spec files,
      resolve cross-document inconsistencies, and set spec_freeze_commit.

